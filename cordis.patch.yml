# dsh-subagent-pro bundle patch.
#
# Two loader entries (mirrors dsh-plugin-subagent-director's main+bridge split):
#   - dsh-subagent-pro            host core: monitor + role routing + agent-md
#                                  (injects tools/subagents/llm/settings/system-prompt/
#                                  jobs/shell/webServer — no client deps)
#   - dsh-subagent-pro-bridge     host webServer route owner for /api/dsh-subagent-pro/settings
#                                  so the browser editor can read/write the
#                                  subagent-pro namespace through a plugin-owned
#                                  prefix route (apiproxy exposedNamespaces()
#                                  allowlist doesn't list third-party plugins).
#                                  (injects webServer + settings)
#
# In headless profiles the bridge entry never activates (no webServer to inject)
# — only the main entry runs.
#
# Install:  dsh plugin --profile <name> add dsh-subagent-pro
# Restart `dsh --profile <name>` after installing.
- insert:
    - id: dsh-subagent-pro
      name: dsh-subagent-pro
- insert:
    - id: dsh-subagent-pro-bridge
      name: dsh-subagent-pro/bridge
