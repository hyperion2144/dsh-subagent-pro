# dsh-subagent-pro bundle patch.
#
# Single loader entry: the host half (subagent monitor + role routing + agent-md
# loading + settings snapshot) and the client half (HUD-style toggle + panel +
# role editor) are both served from one package.
#
# Install:  dsh plugin --profile <name> add dsh-subagent-pro
# Restart `dsh --profile <name>` after installing.
- insert:
    - id: dsh-subagent-pro
      name: dsh-subagent-pro
